<script>
async function enterAdmin(){if(!App.adminToken){showAdminLogin();return}try{await loadAdminTab(App.adminTab||'overview');showAdminDashboard()}catch(e){App.adminToken='';sessionStorage.removeItem(ADMIN_KEY);showAdminLogin();toast(e.message,'error')}}
function showAdminLogin(){$('adminLoginView').hidden=false;$('adminDashboardView').hidden=true}
function showAdminDashboard(){$('adminLoginView').hidden=true;$('adminDashboardView').hidden=false}
$('adminLoginForm').onsubmit=async e=>{e.preventDefault();const pass=$('adminPassword').value;try{const result=await api('adminLogin',pass);App.adminToken=result.token;sessionStorage.setItem(ADMIN_KEY,result.token);$('adminPassword').value='';showAdminDashboard();await loadAdminTab('overview');toast('เข้าสู่ระบบ Admin แล้ว')}catch(err){toast(err.message,'error')}};
$('adminLogoutBtn').onclick=async()=>{try{if(App.adminToken)await api('adminLogout',App.adminToken)}catch(_){}App.adminToken='';sessionStorage.removeItem(ADMIN_KEY);showAdminLogin();toast('ออกจากระบบแล้ว')};
$$('[data-admin-tab]').forEach(b=>b.onclick=()=>loadAdminTab(b.dataset.adminTab).catch(e=>toast(e.message,'error')));
async function loadAdminTab(tab){App.adminTab=tab;$$('[data-admin-tab]').forEach(b=>b.classList.toggle('on',b.dataset.adminTab===tab));$('adminContent').innerHTML='<div class="card panel"><div class="skeleton" style="height:26px;width:35%"></div><div class="skeleton" style="height:160px;margin-top:18px"></div></div>';if(tab==='overview')return renderAdminOverview(await api('getAdminDashboard',App.adminToken));if(tab==='jobs')return renderAdminList('งานล่าสุด',await api('listAdminJobs',App.adminToken,1),'jobs');if(tab==='devices')return renderAdminList('อุปกรณ์',await api('listAdminDevices',App.adminToken,1),'devices');if(tab==='errors')return renderAdminList('ข้อผิดพลาด',await api('listAdminErrors',App.adminToken,1),'errors');if(tab==='references')return renderAdminList('ภาพอ้างอิง',await api('listAdminReferences',App.adminToken,1),'references');if(tab==='settings')return renderAdminSettings(await api('getAdminSettings',App.adminToken))}
function renderAdminOverview(data){const s=data.summary||{};const max=Math.max(1,...(data.daily||[]).map(x=>x.count));$('adminContent').innerHTML=`<div class="metric-grid"><article class="card metric"><span class="muted">งานวันนี้</span><strong>${s.jobsToday||0}</strong><small class="muted">จากโควตารวม ${s.globalLimit||0}</small></article><article class="card metric"><span class="muted">อุปกรณ์ Active</span><strong>${s.activeDevices||0}</strong><small class="muted">ใน 7 วันที่ผ่านมา</small></article><article class="card metric"><span class="muted">Tokens วันนี้</span><strong>${Number(s.tokensToday||0).toLocaleString()}</strong><small class="muted">รวม input/output</small></article><article class="card metric"><span class="muted">Errors วันนี้</span><strong>${s.errorsToday||0}</strong><small class="muted">ตรวจได้ในแท็บข้อผิดพลาด</small></article></div><div class="grid-2" style="margin-top:16px"><article class="card panel"><div class="row-between"><h2 style="margin:0">งานย้อนหลัง 7 วัน</h2><span class="badge">Jobs</span></div><div class="bar-chart">${(data.daily||[]).map(x=>`<div class="bar-col"><span>${x.count}</span><i style="height:${Math.max(5,Math.round(x.count/max*130))}px"></i><span>${escapeHtml(x.date.slice(5))}</span></div>`).join('')}</div></article><article class="card panel"><h2 style="margin-top:0">แพลตฟอร์มวันนี้</h2><div class="stack">${(data.platforms||[]).length?(data.platforms||[]).map(x=>`<div class="row-between"><span>${escapeHtml(platformNames[x.name]||x.name)}</span><strong>${x.count}</strong></div>`).join(''):'<div class="empty">ยังไม่มีงานวันนี้</div>'}</div></article></div><article class="card panel" style="margin-top:16px"><h2 style="margin-top:0">งานล่าสุด</h2>${adminJobsTable(data.latestJobs||[])}</article>`}
function adminJobsTable(items){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Job</th><th>ชื่อ</th><th>Platform</th><th>Mode</th><th>Status</th><th>Tokens</th><th>เวลา</th></tr></thead><tbody>${items.map(x=>`<tr><td>${escapeHtml((x.jobId||'').slice(0,16))}</td><td>${escapeHtml(x.title||'—')}</td><td>${escapeHtml(x.platform||'—')}</td><td>${escapeHtml(x.sourceMode||'—')}</td><td><span class="badge">${escapeHtml(x.state||'—')}</span></td><td>${Number(x.tokens||0).toLocaleString()}</td><td>${formatDate(x.createdAt)}</td></tr>`).join('')}</tbody></table></div>`}
function renderAdminList(title,data,type){let body='';if(type==='jobs')body=adminJobsTable(data.items||[]);if(type==='devices')body=`<div class="table-wrap"><table class="data-table"><thead><tr><th>Device</th><th>Status</th><th>Last seen</th><th>สร้างเมื่อ</th><th></th></tr></thead><tbody>${(data.items||[]).map(x=>`<tr><td>${escapeHtml(x.deviceHash)}</td><td>${escapeHtml(x.status)}</td><td>${formatDate(x.lastSeenAt)}</td><td>${formatDate(x.createdAt)}</td><td><button class="btn btn-outline admin-device-toggle" data-hash="${x.fullHash}" data-status="${x.status==='ACTIVE'?'SUSPENDED':'ACTIVE'}">${x.status==='ACTIVE'?'ระงับ':'เปิดใช้'}</button></td></tr>`).join('')}</tbody></table></div>`;if(type==='errors')body=`<div class="table-wrap"><table class="data-table"><thead><tr><th>Code</th><th>Function</th><th>Message</th><th>เวลา</th></tr></thead><tbody>${(data.items||[]).map(x=>`<tr><td>${escapeHtml(x.code)}</td><td>${escapeHtml(x.functionName)}</td><td>${escapeHtml(x.message)}</td><td>${formatDate(x.createdAt)}</td></tr>`).join('')}</tbody></table></div>`;if(type==='references')body=`<div class="table-wrap"><table class="data-table"><thead><tr><th>Reference</th><th>ชื่อไฟล์</th><th>Status</th><th>ขนาด</th><th>หมดอายุ</th><th></th></tr></thead><tbody>${(data.items||[]).map(x=>`<tr><td>${escapeHtml(x.referenceId.slice(0,16))}</td><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.status)}</td><td>${Math.round((x.byteSize||0)/1024)} KB</td><td>${formatDate(x.expiresAt)}</td><td><button class="btn btn-danger admin-ref-delete" data-id="${x.referenceId}">ลบไฟล์</button></td></tr>`).join('')}</tbody></table></div>`;$('adminContent').innerHTML=`<article class="card panel"><div class="row-between"><div><h2 style="margin:0">${title}</h2><p class="muted">ทั้งหมด ${data.total||0} รายการ</p></div><button class="btn btn-outline" id="adminRefreshBtn">รีเฟรช</button></div>${body}</article>`;$('adminRefreshBtn').onclick=()=>loadAdminTab(type==='jobs'?'jobs':type);$$('.admin-device-toggle').forEach(b=>b.onclick=async()=>{if(!confirm(`เปลี่ยนสถานะอุปกรณ์เป็น ${b.dataset.status}?`))return;try{await api('setDeviceStatus',App.adminToken,b.dataset.hash,b.dataset.status);await loadAdminTab('devices')}catch(e){toast(e.message,'error')}});$$('.admin-ref-delete').forEach(b=>b.onclick=async()=>{if(!confirm('ลบไฟล์ภาพอ้างอิงนี้จาก Drive?'))return;try{await api('deleteAdminReference',App.adminToken,b.dataset.id);await loadAdminTab('references')}catch(e){toast(e.message,'error')}})}
function renderAdminSettings(settings){const fields=[['SYSTEM_ENABLED','เปิดระบบ','boolean'],['MAINTENANCE_MODE','โหมดปรับปรุง','boolean'],['DEVICE_DAILY_LIMIT','โควตาต่ออุปกรณ์','number'],['GLOBAL_DAILY_LIMIT','โควตารวม','number'],['HISTORY_RETENTION_DAYS','เก็บประวัติ (วัน)','number'],['REFERENCE_RETENTION_DAYS','เก็บภาพอ้างอิง (วัน)','number'],['MAX_REFERENCE_IMAGES','จำนวนภาพสูงสุด','number'],['MAX_REFERENCE_IMAGE_MB','ขนาดภาพสูงสุด MB','number'],['MAX_PROMPT_VARIANTS','จำนวนพรอมต์สูงสุด','number'],['OPENAI_MODEL','OpenAI model','text'],['DEFAULT_PLATFORM','แพลตฟอร์มเริ่มต้น','text'],['DEFAULT_LANGUAGE','ภาษาเริ่มต้น','text']];$('adminContent').innerHTML=`<article class="card panel"><h2 style="margin-top:0">ตั้งค่าระบบ</h2><div class="grid-2">${fields.map(([key,label,type])=>{const val=settings[key];if(type==='boolean')return `<label class="summary-item row-between"><span>${label}</span><input class="admin-setting" data-key="${key}" data-type="boolean" type="checkbox" ${String(val).toUpperCase()==='TRUE'||val===true?'checked':''}></label>`;return `<div class="field"><label>${label}</label><input class="input admin-setting" data-key="${key}" data-type="${type}" type="${type==='number'?'number':'text'}" value="${escapeHtml(val==null?'':val)}"></div>`}).join('')}</div><div class="divider"></div><p class="muted">การเปลี่ยนค่าจะมีผลกับคำขอใหม่ทันที และถูกบันทึกใน Admin audit log</p></article>`;$$('.admin-setting').forEach(el=>el.onchange=async()=>{const key=el.dataset.key;const value=el.dataset.type==='boolean'?el.checked:el.dataset.type==='number'?Number(el.value):el.value;if(!confirm(`บันทึก ${key}?`)){await loadAdminTab('settings');return}try{await api('updateAdminSetting',App.adminToken,key,value);toast('บันทึก '+key+' แล้ว')}catch(e){toast(e.message,'error');await loadAdminTab('settings')}})}
</script>
