<script>
const $=id=>document.getElementById(id);
const $$=(sel,root=document)=>Array.from(root.querySelectorAll(sel));
const platformNames={OPENAI:'ChatGPT / OpenAI',GEMINI:'Google Gemini',CANVA:'Canva AI',GENERIC:'พรอมต์กลาง'};
function escapeHtml(value){const div=document.createElement('div');div.textContent=value==null?'':String(value);return div.innerHTML}
function uuid(){if(crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
function toast(message,type=''){const node=document.createElement('div');node.className='toast'+(type?' '+type:'');node.textContent=message;$('toastWrap').append(node);setTimeout(()=>node.remove(),3600)}
function setQuota(q){if(!q)return;$('quotaText').textContent=`${q.remaining}/${q.limit}`;if(App.config)App.config.quota=q}
function route(name){location.hash='#'+name}
function currentRoute(){return (location.hash||'#home').slice(1).split('/')[0]||'home'}
function activateRoute(){const r=currentRoute();$$('.view').forEach(v=>v.classList.toggle('is-active',v.dataset.view===r));$$('.nav-btn[data-route]').forEach(b=>b.classList.toggle('is-active',b.dataset.route===r));$('mainNav').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});onRouteEnter(r)}
async function onRouteEnter(r){try{if(App.config&&App.config.adminOnly&&r!=='admin'){location.reload();return}if(r==='home')renderHome();else if(r==='chat')await enterChat();else if(r==='form')await enterForm();else if(r==='references')await enterReferences();else if(r==='review')await enterReview();else if(r==='result')await enterResult();else if(r==='history')await enterHistory();else if(r==='admin')await enterAdmin();else route('home')}catch(e){toast(e.message||String(e),'error')}}
function showHelp(){const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=`<div class="card modal"><h2>วิธีใช้ Neramit</h2><div class="stack"><div><strong>1. เลือกวิธีเริ่ม</strong><div class="muted">คุยกับ AI หรือกรอกแบบฟอร์มด่วน</div></div><div><strong>2. เพิ่มภาพอ้างอิง</strong><div class="muted">เลือกได้สูงสุด 4 ภาพ และกำหนดว่าจะอ้างอิงส่วนไหน</div></div><div><strong>3. ตรวจสรุป</strong><div class="muted">เช็กข้อความ สี สไตล์ สัดส่วน และตั้งค่าผลลัพธ์</div></div><div><strong>4. สร้างพรอมต์</strong><div class="muted">ใช้โควตา 1 ครั้งเมื่อกดสร้างเท่านั้น</div></div></div><div style="text-align:right;margin-top:18px"><button class="btn btn-primary">เข้าใจแล้ว</button></div></div>`;wrap.querySelector('button').onclick=()=>wrap.remove();wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};document.body.append(wrap)}
function formatDate(value){try{return new Date(value).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}catch(_){return String(value||'')}}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('คัดลอกพรอมต์แล้ว')}catch(_){toast('คัดลอกไม่สำเร็จ กรุณาเลือกข้อความแล้วคัดลอก','error')}}
function setupGlobalEvents(){document.addEventListener('click',e=>{const routeBtn=e.target.closest('[data-route]');if(routeBtn){e.preventDefault();route(routeBtn.dataset.route)}});$('mobileMenuBtn').onclick=()=>$('mainNav').classList.toggle('open');$('helpBtn').onclick=showHelp;window.addEventListener('hashchange',activateRoute)}
async function initialize(){try{localStorage.setItem('neramit_storage_check','1');localStorage.removeItem('neramit_storage_check');const saved=localStorage.getItem(TOKEN_KEY);const config=await api('initializeApp',saved,currentRoute()==='admin'?'ADMIN':'USER');App.token=config.token;App.config=config;App.output.platform=config.defaultPlatform;App.output.language=config.defaultLanguage;localStorage.setItem(TOKEN_KEY,App.token);setQuota(config.quota);fillPlatformOptions();const hint=loadActiveDraftHint();if(hint&&hint.draftId){try{App.currentDraft=await api('getDraft',App.token,hint.draftId)}catch(_){clearActiveDraft()}}App.ready=true;activateRoute();const pending=getPendingJob();if(pending){route('result')}}catch(e){toast(e.message||String(e),'error');document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop"><div class="card modal"><h2>เปิด Neramit ไม่สำเร็จ</h2><p>${escapeHtml(e.message||String(e))}</p><button class="btn btn-primary" onclick="location.reload()">ลองใหม่</button></div></div>`)}}
function fillPlatformOptions(){const list=App.config.platforms||[];$('homePlatforms').innerHTML=list.map(p=>`<span class="badge">${escapeHtml(platformNames[p]||p)}</span>`).join('');['reviewPlatform','historyPlatform'].forEach(id=>{const sel=$(id);if(!sel)return;const first=id==='historyPlatform'?'<option value="">ทุกแพลตฟอร์ม</option>':'';sel.innerHTML=first+list.map(p=>`<option value="${p}">${escapeHtml(platformNames[p]||p)}</option>`).join('')});$('reviewPlatform').value=App.output.platform;$('reviewLanguage').value=App.output.language;$('reviewVariants').innerHTML=Array.from({length:App.config.maxVariants},(_,i)=>`<option value="${i+1}">${i+1} แบบ</option>`).join('');$('reviewVariants').value=String(Math.min(2,App.config.maxVariants));$('refLimitText').textContent=App.config.maxReferenceImages||4}
setupGlobalEvents();initialize();
</script>
