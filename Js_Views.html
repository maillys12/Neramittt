<script>
function renderHome(){if(App.config)setQuota(App.config.quota)}

$('startChatBtn').onclick=async()=>{try{clearActiveDraft();App.currentDraft=await api('createDraft',App.token,'CHAT');saveActiveDraft();route('chat')}catch(e){toast(e.message,'error')}};
$('startFormBtn').onclick=async()=>{try{clearActiveDraft();App.currentDraft=await api('createDraft',App.token,'FORM');saveActiveDraft();route('form')}catch(e){toast(e.message,'error')}};

function briefReady(brief){return !!((brief.topic||brief.work_type)&&brief.aspect_ratio&&((brief.style&&brief.style.length)||brief.additional_details))}
function summaryValue(v){if(Array.isArray(v))return v.join(', ')||'—';return v||'—'}
function renderBriefSummary(targetId,brief){const labels=[['ประเภทงาน','work_type'],['หัวข้อ','topic'],['ข้อความ','poster_text'],['สไตล์','style'],['สี','colors'],['สัดส่วน','aspect_ratio'],['การจัดวาง','composition']];$(targetId).innerHTML=labels.map(([label,key])=>`<div class="summary-item"><small>${label}</small><strong>${escapeHtml(summaryValue(brief[key]))}</strong></div>`).join('')}

async function ensureDraft(mode){if(App.currentDraft&&App.currentDraft.sourceMode===mode)return App.currentDraft;App.currentDraft=await api('createDraft',App.token,mode);saveActiveDraft();return App.currentDraft}

async function enterChat(){const draft=await ensureDraft('CHAT');renderBriefSummary('chatSummary',draft.brief);$('chatReviewBtn').disabled=!briefReady(draft.brief);const data=await api('getChatMessages',App.token,draft.draftId);renderChatMessages(data.items||[])}
function renderChatMessages(items){const list=$('chatMessages');list.innerHTML='';if(!items.length){const b=document.createElement('div');b.className='bubble assistant';b.textContent='สวัสดี 👋 เล่าไอเดียที่อยากทำมาได้เลย เช่น ประเภทงาน หัวข้อ สี หรือสไตล์ที่ชอบ เดี๋ยวฉันช่วยถามต่อเฉพาะส่วนที่ยังขาด';list.append(b)}else items.forEach(item=>{const b=document.createElement('div');b.className='bubble '+(item.role==='USER'?'user':'assistant');b.textContent=item.text;list.append(b)});list.scrollTop=list.scrollHeight}
function renderQuickReplies(items){$('quickReplies').innerHTML=(items||[]).map(x=>`<button type="button" class="chip quick-reply">${escapeHtml(x)}</button>`).join('');$$('.quick-reply',$('quickReplies')).forEach(b=>b.onclick=()=>{ $('chatInput').value=b.textContent;$('chatForm').requestSubmit() })}
$('chatForm').onsubmit=async e=>{e.preventDefault();const text=$('chatInput').value.trim();if(!text||App.busy)return;App.busy=true;$('chatSendBtn').disabled=true;const local=document.createElement('div');local.className='bubble user';local.textContent=text;$('chatMessages').append(local);$('chatInput').value='';$('chatMessages').scrollTop=$('chatMessages').scrollHeight;try{const result=await api('sendChatMessage',App.token,App.currentDraft.draftId,uuid(),text);App.currentDraft=result.draft;saveActiveDraft();const b=document.createElement('div');b.className='bubble assistant';b.textContent=result.reply;$('chatMessages').append(b);renderQuickReplies(result.quickReplies||[]);renderBriefSummary('chatSummary',App.currentDraft.brief);$('chatReviewBtn').disabled=!briefReady(App.currentDraft.brief);$('chatMessages').scrollTop=$('chatMessages').scrollHeight}catch(err){toast(err.message,'error')}finally{App.busy=false;$('chatSendBtn').disabled=false}};
$('chatReviewBtn').onclick=()=>route('references');

let formSaveTimer=null;
async function enterForm(){const draft=await ensureDraft('FORM');fillQuickForm(draft.brief)}
function fillQuickForm(brief){const f=$('quickForm');['work_type','topic','poster_text','additional_details','composition'].forEach(k=>{if(f.elements[k])f.elements[k].value=brief[k]||''});f.elements.preserve_text.checked=brief.preserve_text!==false;$$('[data-style]').forEach(b=>b.classList.toggle('is-selected',(brief.style||[]).includes(b.dataset.style)));$$('[data-color]').forEach(b=>b.classList.toggle('is-selected',(brief.colors||[]).includes(b.dataset.color)));$$('[data-ratio]').forEach(b=>b.classList.toggle('is-selected',brief.aspect_ratio===b.dataset.ratio))}
function collectQuickForm(){const f=$('quickForm');return {work_type:f.elements.work_type.value,topic:f.elements.topic.value,poster_text:f.elements.poster_text.value,preserve_text:f.elements.preserve_text.checked,additional_details:f.elements.additional_details.value,composition:f.elements.composition.value,style:$$('[data-style].is-selected').map(b=>b.dataset.style),colors:$$('[data-color].is-selected').map(b=>b.dataset.color),aspect_ratio:($$('[data-ratio].is-selected')[0]||{}).dataset?.ratio||''}}
async function persistQuickForm(showToast=false){if(!App.currentDraft)return;const updated=await api('updateDraft',App.token,App.currentDraft.draftId,collectQuickForm());App.currentDraft=updated;saveActiveDraft();if(showToast)toast('บันทึกดราฟต์แล้ว')}
$('quickForm').addEventListener('input',()=>{clearTimeout(formSaveTimer);formSaveTimer=setTimeout(()=>persistQuickForm().catch(e=>toast(e.message,'error')),550)});
$$('[data-style]').forEach(b=>b.onclick=()=>{b.classList.toggle('is-selected');persistQuickForm().catch(e=>toast(e.message,'error'))});
$$('[data-color]').forEach(b=>b.onclick=()=>{b.classList.toggle('is-selected');persistQuickForm().catch(e=>toast(e.message,'error'))});
$$('[data-ratio]').forEach(b=>b.onclick=()=>{$$('[data-ratio]').forEach(x=>x.classList.remove('is-selected'));b.classList.add('is-selected');persistQuickForm().catch(e=>toast(e.message,'error'))});
$('formNextBtn').onclick=async()=>{try{await persistQuickForm();if(!App.currentDraft.brief.topic&&!App.currentDraft.brief.work_type)throw new Error('กรุณาระบุหัวข้อหรือประเภทงาน');if(!App.currentDraft.brief.aspect_ratio)throw new Error('กรุณาเลือกสัดส่วนภาพ');route('references')}catch(e){toast(e.message,'error')}};

$('refBackBtn').onclick=()=>route(App.currentDraft&&App.currentDraft.sourceMode==='CHAT'?'chat':'form');
$('skipReferenceBtn').onclick=()=>route('review');$('referenceNextBtn').onclick=()=>route('review');
$('pickReferenceBtn').onclick=()=>$('referenceFile').click();
$('referenceFile').onchange=async()=>{const file=$('referenceFile').files[0];if(!file)return;try{$('uploadToken').value=App.token;$('uploadDraftId').value=App.currentDraft.draftId;$('pickReferenceBtn').disabled=true;toast('กำลังอัปโหลดภาพ...');const uploaded=await uploadReferenceApi($('uploadForm'));App.references.push({...uploaded,analysis:null,selectedAspects:[]});renderReferences();toast('อัปโหลดแล้ว กำลังวิเคราะห์...');const analyzed=await api('analyzeReference',App.token,uploaded.referenceId);const ref=App.references.find(r=>r.referenceId===uploaded.referenceId);if(ref){ref.analysis=analyzed.analysis;ref.selectedAspects=['colors','visual_style','composition'];await api('updateReferenceUsage',App.token,ref.referenceId,ref.selectedAspects)}renderReferences();toast('วิเคราะห์ภาพแล้ว')}catch(e){toast(e.message,'error')}finally{$('pickReferenceBtn').disabled=false;$('referenceFile').value=''}};
async function enterReferences(){if(!App.currentDraft){route('home');return}const review=await api('getReview',App.token,App.currentDraft.draftId);App.currentDraft=review.draft;App.references=review.references||[];for(const ref of App.references){if(!ref.preview){try{const p=await api('getReferencePreview',App.token,ref.referenceId);ref.preview=p.dataUrl}catch(_){}}}renderReferences()}
function aspectLabel(k){return {colors:'โทนสี',visual_style:'สไตล์',composition:'การจัดวาง',subjects:'วัตถุ/ตัวละคร',background:'ฉากหลัง',visible_text:'ข้อความในภาพ'}[k]||k}
function renderReferences(){const grid=$('referenceGrid');if(!App.references.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">ยังไม่มีภาพอ้างอิง คุณสามารถข้ามขั้นตอนนี้ได้</div>';return}grid.innerHTML=App.references.map(ref=>{const a=ref.analysis;return `<article class="card reference-card"><div class="reference-thumb">${ref.preview?`<img src="${ref.preview}" alt="ภาพอ้างอิง">`:'<span class="muted">กำลังโหลดภาพ…</span>'}</div><div class="reference-body"><div class="row-between"><strong>${escapeHtml(ref.name||'ภาพอ้างอิง')}</strong><button class="icon-btn ref-remove" data-id="${ref.referenceId}" title="ลบ">×</button></div>${a?`<div class="analysis"><p><strong>สไตล์:</strong> ${escapeHtml(a.visual_style||'—')}</p><p><strong>สี:</strong> ${escapeHtml((a.colors||[]).join(', ')||'—')}</p><p><strong>การจัดวาง:</strong> ${escapeHtml(a.composition||'—')}</p></div><div class="check-grid">${['colors','visual_style','composition','subjects','background'].map(k=>`<button type="button" class="check-pill ${(ref.selectedAspects||[]).includes(k)?'on':''}" data-ref="${ref.referenceId}" data-aspect="${k}">${aspectLabel(k)}</button>`).join('')}</div>`:'<div class="muted" style="margin-top:10px">กำลังวิเคราะห์ภาพ...</div>'}</div></article>`}).join('');
$$('.ref-remove',grid).forEach(b=>b.onclick=async()=>{try{await api('removeReference',App.token,b.dataset.id);App.references=App.references.filter(r=>r.referenceId!==b.dataset.id);renderReferences();toast('ลบภาพแล้ว')}catch(e){toast(e.message,'error')}});$$('.check-pill',grid).forEach(b=>b.onclick=async()=>{const ref=App.references.find(r=>r.referenceId===b.dataset.ref);if(!ref)return;const set=new Set(ref.selectedAspects||[]);set.has(b.dataset.aspect)?set.delete(b.dataset.aspect):set.add(b.dataset.aspect);ref.selectedAspects=[...set];b.classList.toggle('on',set.has(b.dataset.aspect));try{await api('updateReferenceUsage',App.token,ref.referenceId,ref.selectedAspects)}catch(e){toast(e.message,'error')}})}

$('reviewBackBtn').onclick=()=>route('references');
async function enterReview(){if(!App.currentDraft){route('home');return}const data=await api('getReview',App.token,App.currentDraft.draftId);App.currentDraft=data.draft;App.references=data.references||[];setQuota(data.quota);renderReview(data)}
function renderReview(data){const b=data.draft.brief;const refs=data.references||[];$('reviewDetails').innerHTML=`<div class="review-section"><div class="row-between"><h2 style="margin:0">รายละเอียดงาน</h2><span class="badge">${escapeHtml(data.draft.sourceMode)}</span></div><dl class="review-kv"><dt>ประเภทงาน</dt><dd>${escapeHtml(summaryValue(b.work_type))}</dd><dt>หัวข้อ</dt><dd>${escapeHtml(summaryValue(b.topic))}</dd><dt>สไตล์</dt><dd>${escapeHtml(summaryValue(b.style))}</dd><dt>โทนสี</dt><dd>${escapeHtml(summaryValue(b.colors))}</dd><dt>สัดส่วน</dt><dd>${escapeHtml(summaryValue(b.aspect_ratio))}</dd><dt>การจัดวาง</dt><dd>${escapeHtml(summaryValue(b.composition))}</dd></dl></div><div class="divider"></div><div class="review-section"><h2>ข้อความบนโปสเตอร์ ${b.preserve_text?'🔒':''}</h2><div class="result-prompt" style="min-height:90px">${escapeHtml(b.poster_text||'ไม่มีข้อความที่กำหนด')}</div></div><div class="review-section"><h2>ภาพอ้างอิง</h2>${refs.length?refs.map(r=>`<div class="summary-item"><strong>${escapeHtml(r.name)}</strong><small>ใช้: ${escapeHtml((r.selectedAspects||[]).map(aspectLabel).join(', ')||'ยังไม่ได้เลือกส่วนอ้างอิง')}</small></div>`).join(''):'<p class="muted">ไม่ได้ใช้ภาพอ้างอิง</p>'}</div>`;$('reviewQuota').textContent=`${data.quota.remaining}/${data.quota.limit} ครั้ง`;$('reviewPlatform').value=App.output.platform||App.config.defaultPlatform;$('reviewLanguage').value=App.output.language||App.config.defaultLanguage;$('reviewVariants').value=String(App.output.variant_count||Math.min(2,App.config.maxVariants))}
$('generatePromptBtn').onclick=()=>{App.output={platform:$('reviewPlatform').value,language:$('reviewLanguage').value,variant_count:Number($('reviewVariants').value)};const pending={requestId:uuid(),draftId:App.currentDraft.draftId,config:App.output};setPendingJob(pending);App.result=null;route('result')};

let loadingTimer=null;
async function enterResult(){if(App.result){renderResult(App.result);return}const pending=getPendingJob();if(!pending){route('history');return}$('resultLoading').hidden=false;$('resultContent').hidden=true;cycleLoadingCopy();try{let result=pending.legacy?await api('createPrompt',App.token,pending.requestId,pending.input):await api('submitPromptJob',App.token,pending.requestId,pending.draftId,pending.config);let tries=0;while(result.state==='PROCESSING'&&tries<6){await new Promise(r=>setTimeout(r,3500));result=pending.legacy?await api('createPrompt',App.token,pending.requestId,pending.input):await api('submitPromptJob',App.token,pending.requestId,pending.draftId,pending.config);tries++}if(result.state==='SUCCEEDED'){App.result=result;setPendingJob(null);if(typeof result.remaining==='number'&&App.config)setQuota({remaining:result.remaining,limit:App.config.deviceDailyLimit,used:App.config.deviceDailyLimit-result.remaining});renderResult(result)}else if(result.state==='FAILED'){setPendingJob(null);throw new Error('งานนี้ไม่สำเร็จและคืนโควตาแล้ว')}else{throw new Error('งานยังอยู่ระหว่างดำเนินการ คำขอเดิมถูกเก็บไว้แล้ว เปิดหน้านี้อีกครั้งเพื่อตรวจสถานะ')}}catch(e){$('resultLoading').hidden=true;toast(e.message,'error');$('resultContent').hidden=false;$('resultContent').innerHTML=`<div class="card panel empty"><h2>ยังเปิดผลลัพธ์ไม่ได้</h2><p>${escapeHtml(e.message)}</p><button class="btn btn-primary" onclick="location.reload()">ตรวจสถานะเดิมอีกครั้ง</button></div>`}finally{clearInterval(loadingTimer)}}
function cycleLoadingCopy(){const copy=['Neramit กำลังเรียบเรียงรายละเอียด...','กำลังจัดองค์ประกอบและโทนภาพ...','กำลังตรวจพรอมต์ก่อนส่งให้คุณ...'];let i=0;$('loadingCopy').textContent=copy[0];clearInterval(loadingTimer);loadingTimer=setInterval(()=>{$('loadingCopy').textContent=copy[++i%copy.length]},1800)}
function normalizeResultVariants(result){if(Array.isArray(result.variants)&&result.variants.length)return result.variants;return (result.prompts||[]).map((p,i)=>({label:'แบบที่ '+(i+1),prompt:p}))}
function renderResult(result){clearInterval(loadingTimer);$('resultLoading').hidden=true;$('resultContent').hidden=false;$('resultTitle').textContent=result.title||'พรอมต์ของคุณ';const variants=normalizeResultVariants(result);App.activeVariant=Math.min(App.activeVariant,Math.max(0,variants.length-1));$('resultTabs').innerHTML=variants.map((v,i)=>`<button class="chip ${i===App.activeVariant?'is-selected':''}" data-variant="${i}">แบบที่ ${i+1} · ${escapeHtml(v.label||'')}</button>`).join('');const active=variants[App.activeVariant]||{prompt:''};$('resultPrompt').textContent=active.prompt;$('resultMeta').textContent=`${variants.length} แบบ · พร้อมคัดลอก`;$$('[data-variant]',$('resultTabs')).forEach(b=>b.onclick=()=>{App.activeVariant=Number(b.dataset.variant);renderResult(result)});$('copyPromptBtn').onclick=()=>copyText(active.prompt);$('editAgainBtn').onclick=async()=>{try{if(result.jobId){const draft=await api('cloneHistoryToDraft',App.token,result.jobId);App.currentDraft=draft;saveActiveDraft();App.result=null;route(draft.sourceMode==='CHAT'?'chat':'form')}else route('home')}catch(e){toast(e.message,'error')}}}

let historySearchTimer=null;
async function enterHistory(){App.historyPage=App.historyPage||1;await loadHistory()}
async function loadHistory(){const q=$('historySearch').value.trim(),platform=$('historyPlatform').value;const data=await api('listMyHistory',App.token,App.historyPage,q,platform);renderHistory(data)}
function renderHistory(data){const list=$('historyList');if(!data.items.length)list.innerHTML='<div class="empty">ยังไม่มีประวัติที่ตรงกับเงื่อนไขนี้</div>';else list.innerHTML=data.items.map(item=>`<article class="card history-card"><div><div class="row" style="flex-wrap:wrap"><h3 style="margin:0">${escapeHtml(item.title)}</h3><span class="badge">${escapeHtml(platformNames[item.platform]||item.platform)}</span><span class="badge">${escapeHtml(item.sourceMode)}</span></div><p class="muted">${formatDate(item.createdAt)} · ${item.variantCount} แบบ</p></div><div class="row" style="flex-wrap:wrap"><button class="btn btn-soft history-open" data-id="${item.jobId}">เปิด</button><button class="btn btn-outline history-clone" data-id="${item.jobId}">ใช้เป็นต้นแบบ</button><button class="btn btn-danger history-delete" data-id="${item.jobId}">ซ่อน</button></div></article>`).join('');$('historyPageLabel').textContent=`หน้า ${data.page} · ${data.total} งาน`;$('historyPrev').disabled=data.page<=1;$('historyNext').disabled=!data.hasMore;$$('.history-open',list).forEach(b=>b.onclick=async()=>{try{App.result=await api('openMyHistory',App.token,b.dataset.id);App.activeVariant=0;route('result')}catch(e){toast(e.message,'error')}});$$('.history-clone',list).forEach(b=>b.onclick=async()=>{try{const draft=await api('cloneHistoryToDraft',App.token,b.dataset.id);App.currentDraft=draft;saveActiveDraft();route(draft.sourceMode==='CHAT'?'chat':'form')}catch(e){toast(e.message,'error')}});$$('.history-delete',list).forEach(b=>b.onclick=async()=>{if(!confirm('ซ่อนงานนี้จากประวัติของคุณ?'))return;try{await api('removeMyHistory',App.token,b.dataset.id);await loadHistory()}catch(e){toast(e.message,'error')}})}
$('historySearch').oninput=()=>{clearTimeout(historySearchTimer);historySearchTimer=setTimeout(()=>{App.historyPage=1;loadHistory().catch(e=>toast(e.message,'error'))},350)};$('historyPlatform').onchange=()=>{App.historyPage=1;loadHistory().catch(e=>toast(e.message,'error'))};$('historyPrev').onclick=()=>{if(App.historyPage>1){App.historyPage--;loadHistory()}};$('historyNext').onclick=()=>{App.historyPage++;loadHistory()};$('deleteAllHistoryBtn').onclick=async()=>{if(!confirm('ซ่อนประวัติทั้งหมดจากอุปกรณ์นี้?'))return;try{await api('removeAllMyHistory',App.token);App.historyPage=1;await loadHistory();toast('ซ่อนประวัติทั้งหมดแล้ว')}catch(e){toast(e.message,'error')}};
</script>
