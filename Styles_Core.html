<style>
:root{
  --ink:#111a56;--ink2:#293270;--muted:#72798f;--paper:#fffdf9;--surface:#fff;--line:#e7e9f3;
  --pink:#f755a4;--hot:#ff3f9b;--orange:#ff7548;--yellow:#ffd452;--sky:#57bbf5;--blue:#2674f3;--purple:#966af2;
  --success:#19a87f;--danger:#df4b63;--shadow:0 12px 40px rgba(37,43,91,.08);--radius:22px;
  --grad:linear-gradient(115deg,#ff7b46 0%,#f94f9d 52%,#8b67ed 100%);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}.app-main{width:min(1220px,calc(100% - 36px));margin:auto;padding:28px 0 72px}.view{display:none;animation:viewIn .24s ease both}.view.is-active{display:block}.page-title{font-size:clamp(28px,4vw,44px);line-height:1.2;margin:0;font-weight:900;letter-spacing:-.035em}.page-subtitle{color:var(--muted);margin:8px 0 0}.gradient-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.muted{color:var(--muted)}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid #ece5ed;background:#fff6da;border-radius:999px;font-weight:700;font-size:13px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.decor{position:fixed;z-index:-1;pointer-events:none;user-select:none;opacity:.9}.decor.a{width:180px;height:180px;border-radius:58% 42% 58% 42%;background:#ffe7d5;left:-85px;top:160px;transform:rotate(18deg)}.decor.b{width:150px;height:150px;border-radius:50%;background:#e8f5ff;right:-70px;top:270px}.decor.c{width:135px;height:135px;border-radius:40px;background:#f2eaff;left:-70px;bottom:80px;transform:rotate(25deg)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}@keyframes shimmer{0%{transform:translateX(-110%)}100%{transform:translateX(110%)}}@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@media(max-width:760px){.app-main{width:min(100% - 28px,1220px);padding-top:18px}.section-head{align-items:flex-start;flex-direction:column}.decor{opacity:.55}.page-title{font-size:30px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>
